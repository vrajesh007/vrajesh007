<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Audio Rewind — ANDROID · WEAR OS · AI">
  <defs>
    <linearGradient id="card-bg-01-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14120F"/>
      <stop offset="100%" stop-color="#0B0A08"/>
    </linearGradient>
    <clipPath id="card-clip-01-dark">
      <rect x="0.5" y="0.5" width="419" height="259" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-01-dark)">
    <rect x="0" y="0" width="420" height="260" fill="url(#card-bg-01-dark)"/>
  </g>
  <rect x="0.5" y="0.5" width="419" height="259" rx="12" fill="none" stroke="rgba(246, 242, 234, 0.14)" stroke-width="1"/>

  <!-- Top metadata bar -->
  <text x="24" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#D4A359" letter-spacing="0.8">01</text>
  <rect x="48" y="20" width="135" height="20" rx="10" fill="rgba(212, 163, 89, 0.14)" stroke="rgba(212, 163, 89, 0.34)" stroke-width="0.8"/>
  <text x="115.5" y="33.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.2" font-weight="600" fill="#E2B770" letter-spacing="0.5">GOOGLE PLAY · LIVE</text>
  <text x="396" y="33.5" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" fill="#7D776C" letter-spacing="0.7">PRIVATE SOURCE</text>

  <!-- Title & category -->
  <text x="24" y="76" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" font-weight="400" fill="#F6F2EA" letter-spacing="-0.4">Audio Rewind</text>
  <text x="24" y="96" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" fill="#D4A359" letter-spacing="0.9">ANDROID · WEAR OS · AI</text>

  <!-- Two-line pitch -->
  <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#B8B1A4">Rolling 15s or 30s audio window in memory on Wear OS</text>
  <text x="24" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#B8B1A4">and Android, ready to replay and transcribe.</text>

  <line x1="24" y1="158" x2="396" y2="158" stroke="rgba(246, 242, 234, 0.11)" stroke-width="1"/>

  <!-- 3-column invariants -->
  <text x="24" y="180" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#D4A359">15s / 30s</text>
  <text x="24" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#7D776C">In-memory window</text>
  <text x="152" y="180" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#D4A359">Zero alloc</text>
  <text x="152" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#7D776C">Preallocated buffer</text>
  <text x="280" y="180" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" fill="#D4A359">Watch + Phone</text>
  <text x="280" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#7D776C">Either owns mic</text>

  <line x1="24" y1="214" x2="396" y2="214" stroke="rgba(246, 242, 234, 0.11)" stroke-width="1"/>

